<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc"><title id="title">Сравнение четырёх вариантов архитектуры личного сайта</title><desc id="desc">Качественная редакторская оценка. Один сайт с прямыми входами сочетает релевантность и общую фактологию. Таблица не использует данные о конверсии.</desc><rect width="1200" height="610" fill="#f5f3ec"/><g font-family="Arial,sans-serif" fill="#242824"><text x="40" y="52" font-size="27" font-weight="bold">Какую архитектуру собирать</text><text x="40" y="83" font-size="15" fill="#67705e">Качественное сравнение · проектная оценка, не измеренная эффективность</text><text x="40" y="139" font-size="15" font-weight="bold">Вариант</text><text x="365" y="139" font-size="15" font-weight="bold">Релевантность входа</text><text x="620" y="139" font-size="15" font-weight="bold">Согласованность фактов</text><text x="865" y="139" font-size="15" font-weight="bold">Поддержка</text><path d="M40 222H1158" stroke="#c4c8ba"/><text x="40" y="185" font-size="17">Одна универсальная главная</text><text x="365" y="185" font-size="17">Средняя</text><text x="620" y="185" font-size="17">Высокая</text><text x="865" y="185" font-size="17">Простая</text><rect x="25" y="223" width="1140" height="76" fill="#dce5cf"/><path d="M40 300H1158" stroke="#c4c8ba"/><text x="40" y="263" font-size="17">Один сайт + прямые входы</text><text x="365" y="263" font-size="17">Высокая</text><text x="620" y="263" font-size="17">Высокая</text><text x="865" y="263" font-size="17">Умеренная</text><path d="M40 378H1158" stroke="#c4c8ba"/><text x="40" y="341" font-size="17">Переключатель аудитории</text><text x="365" y="341" font-size="17">Высокая после выбора</text><text x="620" y="341" font-size="17">Высокая</text><text x="865" y="341" font-size="17">Умеренная</text><path d="M40 456H1158" stroke="#c4c8ba"/><text x="40" y="419" font-size="17">Три независимых сайта</text><text x="365" y="419" font-size="17">Высокая</text><text x="620" y="419" font-size="17">Риск расхождений</text><text x="865" y="419" font-size="17">Сложная</text><text x="40" y="535" font-size="20" font-weight="bold">Рекомендация: общая главная + /engineering + /learning + /collaborate</text><text x="40" y="567" font-size="15" fill="#67705e">Посетитель получает нужную ссылку сразу. Выбор аудитории не становится барьером.</text></g></svg>