<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">Три аудитории — одна доказательная основа</title><desc id="desc">Найм, учеба и сотрудничество имеют отдельные входы. Кейсы и факты общие. Стрелки показывают маршрут чтения, а не гарантию результата.</desc><rect width="1200" height="660" fill="#f5f3ec"/><g font-family="Arial, sans-serif" fill="#242824"><text x="48" y="55" font-size="26" font-weight="bold">Три вопроса. Одна правдивая история.</text><text x="48" y="85" font-size="15" fill="#67705e">Проектируемый путь читателя · не прогноз конверсии</text><rect x="48" y="140" width="345" height="100" rx="2" fill="#e1e6d3"/><text x="65" y="168" font-size="12" font-weight="bold">НАЙМ</text><text x="65" y="202" font-size="18">Можно ли доверить задачу?</text><text x="412" y="198" font-size="25">→</text><rect x="458" y="140" width="305" height="100" fill="none" stroke="#929b85"/><text x="477" y="195" font-size="17">Личный вклад + решение</text><text x="784" y="198" font-size="25">→</text><text x="830" y="195" font-size="16">CV / технический разговор</text><rect x="48" y="275" width="345" height="100" rx="2" fill="#eadfcc"/><text x="65" y="303" font-size="12" font-weight="bold">УЧЁБА</text><text x="65" y="337" font-size="18">Как учится и зачем программа?</text><text x="412" y="333" font-size="25">→</text><rect x="458" y="275" width="305" height="100" fill="none" stroke="#929b85"/><text x="477" y="330" font-size="17">Мотивация + проект + вопрос</text><text x="784" y="333" font-size="25">→</text><text x="830" y="330" font-size="16">Обсуждение в рамках приёма</text><rect x="48" y="410" width="345" height="100" rx="2" fill="#dce5e8"/><text x="65" y="438" font-size="12" font-weight="bold">СОТРУДНИЧЕСТВО</text><text x="65" y="472" font-size="18">Что мы можем сделать вместе?</text><text x="412" y="468" font-size="25">→</text><rect x="458" y="410" width="305" height="100" fill="none" stroke="#929b85"/><text x="477" y="465" font-size="17">Прототип + интерес + границы</text><text x="784" y="468" font-size="25">→</text><text x="830" y="465" font-size="16">Небольшой общий эксперимент</text><path d="M48 555H1152" stroke="#9da68c"/><text x="48" y="590" font-size="17">Общее ядро: одни даты, роли, статусы, кейсы и ограничения.</text><text x="48" y="620" font-size="14" fill="#67705e">Адаптируются вступление, порядок доказательств, глубина и следующий шаг.</text></g></svg>