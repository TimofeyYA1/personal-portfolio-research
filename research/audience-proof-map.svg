<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="680" viewBox="0 0 1280 680"><rect width="1280" height="680" fill="#08080a"/><g font-family="Arial,sans-serif"><text x="60" y="80" font-size="36" fill="white">От интереса — к предметному разговору</text><text x="60" y="120" font-size="18" fill="#b5b5c0">Три входа в один сайт. Проектные гипотезы, не измеренная конверсия.</text><text x="60" y="185" font-size="13" fill="#b5b5c0">КТО СМОТРИТ</text><text x="420" y="185" font-size="13" fill="#b5b5c0">ЧТО НУЖНО УВИДЕТЬ</text><text x="910" y="185" font-size="13" fill="#b5b5c0">СЛЕДУЮЩИЙ ШАГ</text><path d="M60 213H1220" stroke="#303038"/><text x="60" y="250" font-size="23" fill="#fff">Инженерная команда</text><text x="60" y="283" font-size="16" fill="#b5b5c0">Можно доверить задачу?</text><text x="420" y="260" font-size="21" fill="#e8e0ff">Личный вклад + проверка ошибки</text><path d="M825 253H865l-8 -6m8 6l-8 6" stroke="#a48aee" fill="none" stroke-width="2"/><text x="910" y="260" font-size="20" fill="#fff">CV и технический разговор</text><path d="M60 338H1220" stroke="#303038"/><text x="60" y="375" font-size="23" fill="#fff">Учёба и развитие</text><text x="60" y="408" font-size="16" fill="#b5b5c0">Как он учится и мыслит?</text><text x="420" y="385" font-size="21" fill="#e8e0ff">Проект + открытый вопрос</text><path d="M825 378H865l-8 -6m8 6l-8 6" stroke="#a48aee" fill="none" stroke-width="2"/><text x="910" y="385" font-size="20" fill="#fff">Учебная мотивация</text><path d="M60 463H1220" stroke="#303038"/><text x="60" y="500" font-size="23" fill="#fff">Будущий партнёр</text><text x="60" y="533" font-size="16" fill="#b5b5c0">Что мы можем сделать вместе?</text><text x="420" y="510" font-size="21" fill="#e8e0ff">Прототип + границы пилота</text><path d="M825 503H865l-8 -6m8 6l-8 6" stroke="#a48aee" fill="none" stroke-width="2"/><text x="910" y="510" font-size="20" fill="#fff">Обсудить один процесс</text><text x="60" y="635" font-size="15" fill="#b5b5c0">Основания и ограни